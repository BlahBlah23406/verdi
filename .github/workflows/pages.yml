name: Deploy Verdi to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: dart run tool/check_algorithm.dart
      - run: dart run tool/check_automation.dart
      - name: Require configured HTTPS backend
        env:
          VERDI_API_URL: ${{ vars.VERDI_API_URL }}
        run: |
          case "$VERDI_API_URL" in
            https://*) ;;
            *) echo "Set repository variable VERDI_API_URL to the hosted pilot API before deploying."; exit 1 ;;
          esac
      - name: Build consumer pilot
        env:
          VERDI_API_URL: ${{ vars.VERDI_API_URL }}
        run: flutter build web --release --base-href /verdi/app/ --dart-define="VERDI_API=$VERDI_API_URL"
      - run: dart run tool/package_site.dart
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
